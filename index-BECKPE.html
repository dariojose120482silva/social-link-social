    rel="stylesheet">
  <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="style.css">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

</head>

<body>
  <main class="main-container">

    <div class="avata-logo">
      <img src="./assets/img/social-logo.png" alt="Avatar" class="avatar">
    </div>

    <h1 class="title">Leno de Cabrobo</h1>

    <p class="p">Assunto X</p>

    <!-- Nav 1: Apenas para as redes sociais -->
    <nav class="social-nav" aria-label="Redes sociais">
      <ul class="social-links-list">
        <li><a href="https://facebook.com" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        </li>
        <li><a href="https://instagram.com" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        </li>
        <li><a href="https://youtube.com" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a></li>
        <li><a href="https://tiktok.com" target="_blank" aria-label="TikTok"><i class="fab fa-tiktok"></i></a></li>
        <li><a href="https://spotify.com" target="_blank" aria-label="Spotify"><i class="fab fa-spotify"></i></a></li>
        <li><a href="https://telegram.org" target="_blank" aria-label="Telegram"><i
              class="fab fa-telegram-plane"></i></a></li>
      </ul>
    </nav>

    <!-- Nav 2: Para os links de apoio (ou links estilo Linktree) -->
    <nav class="support-nav" aria-label="Links de apoio">
      <p class="pp">Sites de Apoio</p>
      <ul class="link-list">

        <li><a href="#" target="_blank" class="link-item">
        <img src="./assets/img/logo-github.png" alt="Logo GitHub" class="link-avatar">
        Link 1</a>
        </li>
        <li><a href="#" target="_blank" class="link-item">
          <img src="./assets/img/logo-github.png" alt="Logo GitHub" class="link-avatar">
          Link 2</a></li>
        <li>
          <a href="#" target="_blank" class="link-item">
           <img src="./assets/img/logo-github.png" alt="Logo GitHub" class="link-avatar"> 
            Link 3</a>
        </li>

        <li><a href="#" target="_blank" class="link-item">
         <img src="./assets/img/logo-github.png" alt="Logo GitHub" class="link-avatar"> 
          Link 4</a></li>

        <li><a href="#" target="_blank" class="link-item">
          <img src="./assets/img/logo-github.png" alt="Logo GitHub" class="link-avatar">
          Link 5</a></li>
      </ul>
    </nav>

  </main>

</body>
